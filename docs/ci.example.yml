name: Source MVP checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      KB_AI_PROVIDER: none
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '25.9.0'
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:http
